<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CardScraper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="card" class="on">Card</button>
    <button type="button" role="tab" data-tab="chat">Chat</button>
  </nav>

  <main id="cardView">
    <div class="hero">
      <img id="preview" alt="">
      <div class="hero-side">
        <label class="lbl" for="name">Name</label>
        <input id="name" autocomplete="off">
        <div id="imgInfo" class="muted"></div>
      </div>
    </div>
    <div id="thumbs" class="thumbs" aria-label="Other images"></div>
    <label class="check"><input type="checkbox" id="keepMd" checked> Keep formatting as Markdown (*actions*, **bold**, lists, headings)</label>

    <section>
      <label class="lbl" for="creator_notes">Public description <span class="count" data-for="creator_notes"></span></label>
      <textarea id="creator_notes" rows="4"></textarea>
    </section>
    <section>
      <label class="lbl" for="scenario">Scenario <span class="count" data-for="scenario"></span></label>
      <textarea id="scenario" rows="5"></textarea>
    </section>
    <section>
      <label class="lbl" for="personality">Personality <span class="count" data-for="personality"></span></label>
      <textarea id="personality" rows="7"></textarea>
      <label class="check"><input type="checkbox" id="persAsDesc" checked> Store as Description (what SillyTavern shows as the main definition)</label>
    </section>
    <section>
      <label class="lbl" for="first_mes">First message <span class="count" data-for="first_mes"></span></label>
      <textarea id="first_mes" rows="6"></textarea>
    </section>
    <section>
      <label class="lbl" for="mes_example">Example dialogs <span class="count" data-for="mes_example"></span></label>
      <textarea id="mes_example" rows="6"></textarea>
    </section>
  </main>

  <main id="chatView" hidden>
    <div class="names">
      <div><label class="lbl" for="chatChar">Character</label><input id="chatChar" autocomplete="off"></div>
      <div><label class="lbl" for="chatUser">You</label><input id="chatUser" autocomplete="off" value="You"></div>
    </div>
    <label class="check"><input type="checkbox" id="chatLoadAll" checked> Scroll up and load the whole chat history</label>
    <label class="check"><input type="checkbox" id="chatMd" checked> Keep formatting as Markdown (*actions*)</label>
    <div class="row chat-tools">
      <span id="chatCount" class="muted"></span>
      <button id="rescanChat" type="button" class="small">Scan chat</button>
    </div>
    <ol id="chatList" class="chat"></ol>
  </main>

  <footer>
    <div id="status" aria-live="polite"></div>
    <div class="row" id="cardActions">
      <button id="savePng" class="primary">Save card PNG</button>
      <button id="saveJson">JSON</button>
    </div>
    <div class="row" id="chatActions" hidden>
      <button id="saveChat" class="primary" disabled>Save chat (.jsonl)</button>
    </div>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
