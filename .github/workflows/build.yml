name: Build IPA

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write # needed to attach the IPA to releases

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen and ldid
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project SafariScraper.xcodeproj \
            -target SafariScraper \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: .*SafariScraper|BUILD" || true
          test -d build/Release-iphoneos/SafariScraper.app || { tail -100 build.log; exit 1; }

      - name: Sanity-check bundle layout
        run: |
          APP=build/Release-iphoneos/SafariScraper.app
          APPEX="$APP/PlugIns/SafariScraperExtension.appex"
          ls -la "$APP" "$APPEX"
          for f in manifest.json popup.html popup.js content.js background.js zip.js icon-128.png; do
            test -f "$APPEX/$f" || { echo "::error::missing $f in appex"; exit 1; }
          done
          plutil -p "$APPEX/Info.plist"
          CARD="$APP/PlugIns/CardScraperExtension.appex"
          for f in manifest.json popup.html popup.js content.js png.js batch.js batch-popup.js chat.js page.js zip.js icon-128.png; do
            test -f "$CARD/$f" || { echo "::error::missing $f in card appex"; exit 1; }
          done

      - name: Fake-sign (ldid) and package IPA
        run: |
          APP=build/Release-iphoneos/SafariScraper.app
          ldid -S "$APP/PlugIns/SafariScraperExtension.appex/SafariScraperExtension"
          ldid -S "$APP/PlugIns/CardScraperExtension.appex/CardScraperExtension"
          ldid -S "$APP/SafariScraper"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry SafariScraper.ipa Payload
          ls -la SafariScraper.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SafariScraper-ipa
          path: SafariScraper.ipa

      # Rolling "latest" release so there's always a direct, login-free link:
      # https://github.com/<owner>/<repo>/releases/download/latest/SafariScraper.ipa
      - name: Publish rolling "latest" release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest SafariScraper.ipa \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest build" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Direct download: SafariScraper.ipa"

      - name: Attach to release
        if: github.event_name == 'release' && github.event.release.tag_name != 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" SafariScraper.ipa --clobber
